services:
  cam-server:
    build:
      context: .
      args:
        # 基础镜像源，国内 Docker Hub 连不上时可在 .env 里换加速地址
        BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"
        # 构建镜像时 pip 用的源，可在 .env 里覆盖（国内网络建议保留默认清华源）
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: bilimouse-cam-server:latest
    container_name: bilimouse-cam-server
    restart: unless-stopped
    ports:
      # 左边是宿主机端口（.env 的 HOST_PORT 可改），右边是容器内端口。
      # 设备端要填「宿主机IP:39110」
      - "${HOST_PORT:-39110}:39110"
    environment:
      # 必填：从项目根目录 .env 读取（.env 已被 .gitignore 排除）。
      # 没填时 compose 直接报错，避免服务在「无密钥」状态下裸奔。
      CAM_API_KEY: "${CAM_API_KEY:?请在 .env 中设置 CAM_API_KEY（参考 .env.example）}"
      # 观看端鉴权：1=需要登录（默认）；0=仅可信内网调试时免密
      PROTECT_VIEW: "${PROTECT_VIEW:-1}"
      ALLOW_KEY_IN_QUERY: "${ALLOW_KEY_IN_QUERY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      SESSION_TTL: "${SESSION_TTL:-604800}"
      # 每 N 帧存一张到 /data（0 = 不存）
      SAVE_EVERY: "0"
      # 快照目录
      SNAPSHOT_DIR: "/data"
      # JPEG 质量
      JPEG_QUALITY: "80"
      LOG_LEVEL: "INFO"
    volumes:
      # 快照落盘：docker compose up -d 后宿主机 ./data 里就是图片
      - ./data:/data
