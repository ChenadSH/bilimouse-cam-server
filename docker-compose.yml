services:
  cam-server:
    build:
      context: .
      args:
        # 基础镜像源，国内 Docker Hub 连不上时可在 .env 里换加速地址
        BASE_IMAGE: "${BASE_IMAGE:-python:3.12-slim}"
        # 构建镜像时 pip 用的源，可在 .env 里覆盖（国内网络建议保留默认清华源）
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: bilimouse-cam-server:latest
    container_name: bilimouse-cam-server
    restart: unless-stopped
    ports:
      # 左边是宿主机端口（.env 的 HOST_PORT 可改），右边是容器内端口。
      # 设备端要填「宿主机IP:39110」
      - "${HOST_PORT:-39110}:39110"
    environment:
      # 必填：从项目根目录 .env 读取（.env 已被 .gitignore 排除）。
      # 没填时 compose 直接报错，避免服务在「无密钥」状态下裸奔。
      CAM_API_KEY: "${CAM_API_KEY:?请在 .env 中设置 CAM_API_KEY（参考 .env.example）}"
      # 观看端鉴权：1=需要登录（默认）；0=仅可信内网调试时免密
      PROTECT_VIEW: "${PROTECT_VIEW:-1}"
      ALLOW_KEY_IN_QUERY: "${ALLOW_KEY_IN_QUERY:-0}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      SESSION_TTL: "${SESSION_TTL:-604800}"
      # 每 N 帧存一张到 /data（0 = 不存）
      SAVE_EVERY: "0"
      # 快照目录
      SNAPSHOT_DIR: "/data"
      # 录制目录（在 /data 卷内，按 YYYY-MM-DD 分子目录）
      RECORD_DIR: "/data/recordings"
      # 按需推流：1=只有网页有人/在录制时才接受设备推流（默认，省流量）
      GATE_ENABLED: "${GATE_ENABLED:-1}"
      PRESENCE_TTL: "${PRESENCE_TTL:-8}"
      GATE_POLL_MS: "${GATE_POLL_MS:-2000}"
      # 录制：单次最长秒数（默认 600=10 分钟）、设备掉线判定、回放帧率
      RECORD_MAX_SECONDS: "${RECORD_MAX_SECONDS:-600}"
      RECORD_OFFLINE_TIMEOUT: "${RECORD_OFFLINE_TIMEOUT:-8}"
      RECORD_PLAY_FPS: "${RECORD_PLAY_FPS:-2}"
      # 日期文件夹按哪个时区（容器多为 UTC，默认 +8 北京时间）
      TZ_OFFSET_HOURS: "${TZ_OFFSET_HOURS:-8}"
      # JPEG 质量
      JPEG_QUALITY: "80"
      LOG_LEVEL: "INFO"
    volumes:
      # 快照 + 录制都落在宿主机 ./data：./data/recordings/YYYY-MM-DD/*.mjpg
      - ./data:/data
